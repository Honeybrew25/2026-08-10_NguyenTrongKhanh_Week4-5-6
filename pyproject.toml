[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-lab"
version = "0.1.0"
description = "Agent IAM and security-result normalization lab"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "rich==14.3.3",
]

[project.scripts]
safe-api-tool = "safe_api_tool.__main__:main"
project-sentinel = "project_sentinel.__main__:main"

[project.optional-dependencies]
agent = ["google-genai==2.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"security_pipeline.analysis" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the local Docker Compose IAM stack",
]
