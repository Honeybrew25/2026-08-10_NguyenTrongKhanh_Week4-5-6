[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-lab"
version = "0.1.0"
description = "Agent IAM and security-result normalization lab"
requires-python = ">=3.11"

[project.optional-dependencies]
agent = ["openai==2.45.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"security_pipeline.analysis" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the local Docker Compose IAM stack",
]
