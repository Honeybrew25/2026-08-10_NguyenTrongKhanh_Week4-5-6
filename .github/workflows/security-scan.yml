name: CI and container delivery

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-sast:
    name: Unit tests and Bandit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            src/authz_service/requirements.txt
            security/requirements.txt

      - name: Install test and scanner dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --requirement security/requirements.txt

      - name: Run unit tests
        run: python -m pytest -q -m "not integration"

      - name: Run Bandit
        if: always()
        id: bandit
        continue-on-error: true
        run: >-
          python scripts/run_security_scan.py
          --output security-results/bandit-ci.json
          --severity-level high

      - name: Upload Bandit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-json
          path: security-results/bandit-ci.json
          if-no-files-found: error

      - name: Generate grounded Week 3 JSONL
        if: always()
        run: >-
          python -m security_pipeline analyze
          security-results/normalized-findings.json
          --knowledge-base data/vulnerabilities.json
          --provider deterministic
          --output security-results/security-analysis-ci.jsonl

      - name: Upload Week 3 security analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week3-security-analysis-jsonl
          path: security-results/security-analysis-ci.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Fail when Bandit found reportable issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1

  docker-integration:
    name: Docker integration tests
    needs: unit-and-sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            src/authz_service/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run real Keycloak, Envoy, IAM and Safe API Tool tests
        run: python scripts/run_all_tests.py

      - name: Upload sanitized Week 4 Safe API demo receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-safe-api-demo-receipts
          path: security-results/runs/week-4/safe-api-demo-ci.jsonl
          if-no-files-found: warn
          retention-days: 14

  dast:
    name: OWASP ZAP Baseline
    needs: unit-and-sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "KEYCLOAK_ADMIN_USERNAME=ci-admin" >> "$GITHUB_ENV"

          for name in \
            KEYCLOAK_ADMIN_PASSWORD \
            AGENT_READER_CLIENT_SECRET \
            AGENT_ADMIN_CLIENT_SECRET \
            INTEGRATION_EXPIRED_CLIENT_SECRET \
            INTEGRATION_WRONG_AUDIENCE_CLIENT_SECRET \
            SAFE_API_TOOL_API_KEY
          do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start staging stack
        run: >-
          docker compose up
          --build
          --detach
          --wait
          --wait-timeout 180

      - name: Prepare report directory
        run: |
          mkdir -p security-results
          chmod 777 security-results

      - name: Run ZAP Baseline
        shell: bash
        run: |
          envoy_id="$(docker compose ps --quiet envoy)"
          network="$(
            docker inspect \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' \
              "$envoy_id"
          )"

          docker run --rm \
            --network "$network" \
            --volume "$PWD/security-results:/zap/wrk:rw" \
            zaproxy/zap-stable:2.17.0 \
            zap-baseline.py \
            -t "http://envoy:8080/health" \
            -J "zap-baseline-ci.json" \
            -r "zap-baseline-ci.html" \
            -m 1 \
            -I

      - name: Validate ZAP JSON
        run: >-
          python -m json.tool
          security-results/zap-baseline-ci.json
          > /dev/null

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            security-results/zap-baseline-ci.json
            security-results/zap-baseline-ci.html
          if-no-files-found: error

      - name: Stop staging stack
        if: always()
        run: docker compose down --remove-orphans

  publish-images:
    name: Publish ${{ matrix.image }}
    needs:
      - unit-and-sast
      - docker-integration
      - dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: staging-api
            dockerfile: src/app/Dockerfile
          - image: authz-service
            dockerfile: src/authz_service/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create lowercase image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
