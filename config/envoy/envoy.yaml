static_resources:
  listeners:
    - name: gateway
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                generate_request_id: true
                preserve_external_request_id: true
                stream_idle_timeout: 15s
                route_config:
                  name: staging_routes
                  virtual_hosts:
                    - name: staging_api
                      domains: ["*"]
                      # Expose the generated or supplied request ID to callers.
                      response_headers_to_add:
                        - header:
                            key: x-request-id
                            value: "%REQ(X-REQUEST-ID)%"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match: { path: "/health" }
                          route: { cluster: staging_api, timeout: 5s }
                        - match: { path: "/.well-known/oauth-protected-resource" }
                          route: { cluster: staging_api, timeout: 5s }
                        - match: { prefix: "/api/" }
                          route: { cluster: staging_api, timeout: 5s }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "Not found\n" }
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: "text/plain; charset=utf-8"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  # Every request receives an explicit allow or deny decision.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://authz-service:8001
                          cluster: authz_service
                          timeout: 1s
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-agent-id
                          allowed_client_headers:
                            patterns:
                              - exact: content-type
                              - exact: www-authenticate
                      allowed_headers:
                        patterns:
                          # Checked by authz-service and left unchanged upstream.
                          - exact: authorization
                          - exact: x-request-id
                      failure_mode_allow: false
                      status_on_error: { code: ServiceUnavailable }
                      validate_mutations: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: staging_api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: staging_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 8000

    - name: authz_service
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: authz_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authz-service
                      port_value: 8001
